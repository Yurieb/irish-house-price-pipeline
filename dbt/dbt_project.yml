name: house_prices
version: "1.0.0"
profile: house_prices

model-paths: ["models"]
test-paths: ["tests"]

models:
  house_prices:
    # staging = views, just light tidy-ups of the raw tables
    staging:
      +materialized: view
    # marts = tables so the app and Power BI don't recalculate the medians every time
    marts:
      +materialized: table
      # dbt rebuilds these tables every run, which wipes their grants.
      # this gives the read-only ask user its select back, and does nothing if that user doesn't exist
      +post-hook: >
        DO $$ BEGIN
          IF EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ env_var("ASK_POSTGRES_USER", "ask_reader") }}') THEN
            EXECUTE 'GRANT SELECT ON {{ this }} TO {{ env_var("ASK_POSTGRES_USER", "ask_reader") }}';
          END IF;
        END $$

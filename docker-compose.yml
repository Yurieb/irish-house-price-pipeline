services:
  db:
    image: postgres:17
    # These values come from the .env file, never from this file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    # A named volume keeps the data when the container is stopped or rebuilt.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets Docker report when Postgres is actually ready to accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
